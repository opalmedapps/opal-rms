name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Add .npmrc for NES token
      - name: Create .npmrc
        env:
          NPMRC_FILE: ${{ secrets.NPMRC_FILE }}
        run: echo "$NPMRC_FILE" > .npmrc
      # Use setup-node's built-in functionality for caching and restoring npm dependencies
      # See: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          # renovate: datasource=node-version dependency=node
          node-version: 24.14.0
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm --version
          npm ci
  lint:
    uses: opalmedapps/actions/.github/workflows/prek.yaml@main
    with:
      skip: reuse-lint-file

  run-reuse-workflow:
    uses: opalmedapps/.github/.github/workflows/reuse.yaml@main

  build-image:
    needs:
      - lint
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    secrets:
      NPMRC_FILE: ${{ secrets.NPMRC_FILE }}
